[package]
name = "img"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.22.1"
blurhash = "0.2.3"
color-thief = "0.2.2"
image = { version = "0.25.6", features = ["avif", "avif-native"] }
log = "0.4.27"
mockall = "0.13.1"
mozjpeg = { version = "0.10.13", optional = true }
ravif = { version = "0.12.0", default-features = false }
reqwest = { version = "0.12.15", features = ["blocking"]}
serde = { version = "1.0.218", features = ["derive"] }
strum = "0.27.1"
strum_macros = "0.27.1"
tempfile = "3.20.0"
thiserror = "2.0.12"
tokio = { version = "1.46.1", features = ["macros", "rt-multi-thread", "fs"] }
tokio-macros = "2.5.0"
trash = "5.2.2"
url = "2.5.4"
walkdir = "2.5.0"
webp = "0.3.0"
zip = "4.3.0"

[dev-dependencies]
httpmock = "0.7.0"
http = "1.3.1"

[features]
default = []
nasm = ["ravif/default"]
progressive-jpeg = ["mozjpeg"]
