[package]
name = "razr"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.22.1"
blurhash = "0.2.3"
color-thief = "0.2.2"
image = { version = "0.25.6", features = ["avif", "avif-native"] }
log = "0.4.27"
mozjpeg = { version = "0.10.13", optional = true }
ravif = { version = "0.12.0", default-features = false }
reqwest = { version = "0.12.15", features = ["blocking"] }
serde = { version = "1.0.218", features = ["derive"] }
strum = "0.27.1"
strum_macros = "0.27.1"
tempfile = "3.20.0"
thiserror = "2.0.12"
tokio = { version = "1.46.1", features = ["macros", "rt-multi-thread", "fs"], optional = true }
tokio-macros = { version = "2.5.0", optional = true }
url = "2.5.4"
walkdir = "2.5.0"
webp = "0.3.0"
zip = "4.3.0"
fs-ext = { git = "https://github.com/JordanRoberts-2000/fs-ext", branch = "main" }
bytemuck = "1.23.2"
tar = "0.4.44"
flate2 = "1.1.4"
subenum = "1.1.3"
inherent = "1.0.13"
resvg = "0.45.1"
usvg = "0.45.1"

[dev-dependencies]
httpmock = "0.7.0"
http = "1.3.1"

[features]
default = ["progressive-jpeg"]
nasm = ["ravif/default"]
progressive-jpeg = ["mozjpeg"]
tokio = ["dep:tokio", "dep:tokio-macros"]
